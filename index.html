<!DOCTYPE html>
<html>
<head>
  <title>Mapa desde Google Sheets</title>
  <style>
    #map {
      height: 500px;
      width: 100%;
      border: 2px solid #000;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Última Ubicación Registrada</h1>
  <div id="map"></div>

  <!-- Librería Google Charts para consultar Google Sheets -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <!-- Google Maps API (Reemplaza TU_API_KEY con tu clave real) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBoW_q97JAwyylGNUKcjuO74arOu8hqeho" async defer></script>

  <script>
    let mapa;

    // Cargar Google Charts
    google.charts.load('current', { packages: ['corechart'] });

    google.charts.setOnLoadCallback(inicializar);

    function waitForGoogleMaps(callback) {
      if (typeof google === 'object' && typeof google.maps === 'object') {
        callback();
      } else {
        setTimeout(() => waitForGoogleMaps(callback), 100);
      }
    }

    function inicializar() {
      waitForGoogleMaps(() => {
        mapa = new google.maps.Map(document.getElementById("map"), {
          zoom: 14,
          center: { lat: 19.4326, lng: -99.1332 } // Centro temporal (CDMX)
        });

        cargarUltimaUbicacion();
      });
    }

    function cargarUltimaUbicacion() {
      // REEMPLAZA con el ID de tu Google Sheet (NO el de publicación)
      const sheetID = "1EjvJRmv4ZsjKvKOunJqgtSs9hs8t00atWNxJbL3F2Uw";

      // Nombre exacto de la hoja dentro del archivo
      const nombreHoja = "Ubicacion";

      // Crear la URL de consulta
      const urlQuery = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?sheet=${nombreHoja}`;

      // Hacer la consulta
      const query = new google.visualization.Query(urlQuery);
      query.send(response => {
        if (response.isError()) {
          console.error("Error en la consulta: " + response.getMessage());
          alert("Error al consultar la hoja. Verifica que esté compartida correctamente.");
          return;
        }

        const data = response.getDataTable();
        const numFilas = data.getNumberOfRows();
        if (numFilas === 0) {
          alert("No hay datos en la hoja.");
          return;
        }

        const ultimaFila = numFilas - 1;
        const fecha = data.getValue(ultimaFila, 0);
        const hora = data.getValue(ultimaFila, 1);
        const lat = parseFloat(data.getValue(ultimaFila, 2));
        const lng = parseFloat(data.getValue(ultimaFila, 3));

        if (isNaN(lat) || isNaN(lng)) {
          alert("Latitud o longitud inválida.");
          return;
        }

        const posicion = { lat, lng };
        mapa.setCenter(posicion);

        new google.maps.Marker({
          position: posicion,
          map: mapa,
          title: `Fecha: ${fecha} - Hora: ${hora}`
        });
      });
    }
  </script>
</body>
</html>
