<!DOCTYPE html>
<html>
<head>
  <title>Mapa en Tiempo Real</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }

    .tab-btn {
      padding: 10px 14px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
      border-radius: 8px;
    }

    .tab-btn.active {
      background: #e9e9e9;
      border-color: #999;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .map {
      height: 500px;
      width: 100%;
      border: 2px solid #000;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>Ubicación en Tiempo Real</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="tab1">Dispositivo 1</button>
  <button class="tab-btn" data-tab="tab2">Dispositivo 2</button>
</div>

<div id="tab1" class="tab-panel active">
  <div id="map1" class="map"></div>
</div>

<div id="tab2" class="tab-panel">
  <div id="map2" class="map"></div>
</div>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDPFswYN5k_DJXBL5b5wr7Jy_Tk4ZoaSIU" async defer></script>

<script>

let mapa1, mapa2;
let marcador1, marcador2;

let lastPos1 = null;
let lastPos2 = null;

const sheetID = "1EjvJRmv4ZsjKvKOunJqgtSs9hs8t00atWNxJbL3F2Uw";
const nombreHoja = "Ubicacion";

const colFecha = 0;
const colHora  = 1;
const colLat   = 2;
const colLng   = 3;
const colMapa  = 4;

google.charts.load('current', { packages: ['corechart'] });
google.charts.setOnLoadCallback(inicializar);

function waitForGoogleMaps(callback) {
  if (window.google && google.maps) {
    callback();
  } else {
    setTimeout(() => waitForGoogleMaps(callback), 100);
  }
}

function inicializar() {

  waitForGoogleMaps(() => {

    mapa1 = new google.maps.Map(document.getElementById("map1"), {
      zoom: 15,
      center: { lat: 0, lng: 0 }
    });

    mapa2 = new google.maps.Map(document.getElementById("map2"), {
      zoom: 15,
      center: { lat: 0, lng: 0 }
    });

    cargarUbicaciones();
    setInterval(cargarUbicaciones, 2000);

  });
}

// Tabs
document.querySelectorAll(".tab-btn").forEach(btn => {

  btn.addEventListener("click", () => {

    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));

    btn.classList.add("active");

    const tabId = btn.dataset.tab;
    document.getElementById(tabId).classList.add("active");

    setTimeout(() => {

      if (tabId === "tab1" && lastPos1) {
        google.maps.event.trigger(mapa1, "resize");
        mapa1.setCenter(lastPos1);
      }

      if (tabId === "tab2" && lastPos2) {
        google.maps.event.trigger(mapa2, "resize");
        mapa2.setCenter(lastPos2);
      }

    }, 100);

  });

});

// ===================== DATA ======================

function cargarUbicaciones() {

  const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?sheet=${nombreHoja}`;
  const query = new google.visualization.Query(url);

  query.send(response => {

    if (response.isError()) {
      console.error("Error Sheet:", response.getMessage());
      return;
    }

    const data = response.getDataTable();
    const rows = data.getNumberOfRows();

    if (rows === 0) return;

    let pos1 = null;
    let pos2 = null;

    let title1 = "";
    let title2 = "";

    for (let i = 0; i < rows; i++) {

      const lat = parseFloat(data.getValue(i, colLat));
      const lng = parseFloat(data.getValue(i, colLng));
      const mapaDestino = parseInt(data.getValue(i, colMapa));

      if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
      if (mapaDestino !== 1 && mapaDestino !== 2) continue;

      const fecha = data.getValue(i, colFecha);
      const hora  = data.getValue(i, colHora);

      const titulo = `Última actualización: ${fecha} ${hora}`;
      const pos = { lat, lng };

      if (mapaDestino === 1) {
        pos1 = pos;
        title1 = titulo;
      }

      if (mapaDestino === 2) {
        pos2 = pos;
        title2 = titulo;
      }

    }

    if (pos1) {
      lastPos1 = pos1;
      actualizarMapa(mapa1, 1, pos1, title1);
    }

    if (pos2) {
      lastPos2 = pos2;
      actualizarMapa(mapa2, 2, pos2, title2);
    }

  });
}

function actualizarMapa(mapa, cual, pos, titulo) {

  mapa.setCenter(pos);

  if (cual === 1) {

    if (marcador1) {
      marcador1.setPosition(pos);
      marcador1.setTitle(titulo);
    } else {
      marcador1 = new google.maps.Marker({
        position: pos,
        map: mapa,
        title: titulo
      });
    }

  } else {

    if (marcador2) {
      marcador2.setPosition(pos);
      marcador2.setTitle(titulo);
    } else {
      marcador2 = new google.maps.Marker({
        position: pos,
        map: mapa,
        title: titulo
      });
    }

  }
}

</script>

</body>
</html>
