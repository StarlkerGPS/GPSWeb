<!DOCTYPE html>
<html>
<head>
  <title>Última Ubicación en Mapa</title>
  <style>
    #map {
      height: 500px;
      width: 100%;
      border: 2px solid #000;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Última Ubicación Registrada</h1>
  <div id="map"></div>

  <!-- Cargar API de Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBoW_q97JAwyylGNUKcjuO74arOu8hqeho&callback=initMap" async defer></script>

  <!-- Google Charts para acceder a Google Sheets -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <script>
    let mapa;

    function initMap() {
      const centroInicial = { lat: 19.4326, lng: -99.1332 }; // Centro provisional
      mapa = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: centroInicial,
      });

      cargarUltimaUbicacion();
    }

function cargarUltimaUbicacion() {
  const sheetID = "TU_ID_DE_HOJA"; // <-- Reemplaza
  const query = new google.visualization.Query(
    `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?sheet=Ubicacion`
  );

  query.send(function (response) {
    if (response.isError()) {
      console.error("Error al obtener datos: " + response.getMessage());
      return;
    }

    const data = response.getDataTable();
    const numFilas = data.getNumberOfRows();
    console.log("Filas detectadas:", numFilas);

    if (numFilas === 0) {
      console.warn("No hay datos en la hoja.");
      return;
    }

    const i = numFilas - 1;
    const fecha = data.getValue(i, 0);
    const hora = data.getValue(i, 1);
    const lat = parseFloat(data.getValue(i, 2));
    const lng = parseFloat(data.getValue(i, 3));

    console.log("Datos de la última fila:", fecha, hora, lat, lng);

    if (!isNaN(lat) && !isNaN(lng)) {
      const posicion = { lat, lng };
      mapa.setCenter(posicion);

      new google.maps.Marker({
        position: posicion,
        map: mapa,
        title: `${fecha} ${hora}`,
      });
    } else {
      console.warn("Latitud o longitud inválida:", lat, lng);
    }
  });
}
  </script>
</body>
</html>
