<!DOCTYPE html>
<html>
<head>
  <title>Mapa con Datos de Google Sheets</title>
  <style>
    #map {
      height: 500px;
      width: 100%;
      border: 2px solid #000;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Última Ubicación Registrada</h1>
  <div id="map"></div>

  <!-- 1. Google Charts para consulta Google Sheets -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <!-- 2. Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBoW_q97JAwyylGNUKcjuO74arOu8hqeho" async defer></script>

  <script>
    let mapa;

    // Carga la librería Google Charts
    google.charts.load('current', { packages: ['corechart'] });

    // Espera que ambas librerías estén listas para iniciar
    google.charts.setOnLoadCallback(inicializar);

    // Espera que Google Maps esté cargado antes de continuar
    function waitForGoogleMaps(callback) {
      if (typeof google === 'object' && typeof google.maps === 'object') {
        callback();
      } else {
        setTimeout(() => waitForGoogleMaps(callback), 100);
      }
    }

    function inicializar() {
      waitForGoogleMaps(() => {
        // Crear mapa con centro provisional
        mapa = new google.maps.Map(document.getElementById("map"), {
          zoom: 14,
          center: { lat: 19.4326, lng: -99.1332 }, // CDMX centro provisional
        });

        cargarUltimaUbicacion();
      });
    }

    function cargarUltimaUbicacion() {
      const sheetID = "1EjvJRmv4ZsjKvKOunJqgtSs9hs8t00atWNxJbL3F2Uw";  // Aquí pones el ID real de tu hoja

      const query = new google.visualization.Query(
        `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?sheet=Ubicacion`
      );

      query.send(response => {
        if (response.isError()) {
          console.error("Error al obtener datos: " + response.getMessage());
          return;
        }

        const data = response.getDataTable();
        const numFilas = data.getNumberOfRows();
        console.log("Filas obtenidas:", numFilas);

        if (numFilas === 0) {
          alert("No hay datos en la hoja 'Ubicacion'");
          return;
        }

        // Tomar la última fila (última ubicación)
        const i = numFilas - 1;

        const fecha = data.getValue(i, 0);
        const hora = data.getValue(i, 1);
        const lat = parseFloat(data.getValue(i, 2));
        const lng = parseFloat(data.getValue(i, 3));

        console.log("Última ubicación:", fecha, hora, lat, lng);

        if (isNaN(lat) || isNaN(lng)) {
          alert("Latitud o longitud inválidas en la última fila");
          return;
        }

        const posicion = { lat, lng };
        mapa.setCenter(posicion);

        new google.maps.Marker({
          position: posicion,
          map: mapa,
          title: `Fecha: ${fecha} Hora: ${hora}`
        });
      });
    }
  </script>
</body>
</html>
